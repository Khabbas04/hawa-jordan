<!doctype html>
<html lang="en">
<head>
  <script src="js/language-init.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore Jordan through desert, water, history, food, nature and local life.">
  <meta name="theme-color" content="#0a1718">
  <title>Explore Jordan — Hawa Jordan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/explore.css">
</head>
<body class="page-explore" data-page="explore">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header id="site-header" class="site-header" aria-label="Primary navigation"></header>

  <main id="main-content" class="explore-main">
    <div class="explore-backdrop" id="explore-backdrop" aria-hidden="true"></div>
    <div class="explore-backdrop explore-backdrop--next" id="explore-backdrop-next" aria-hidden="true"></div>
    <div class="explore-vignette" aria-hidden="true"></div>

    <aside class="category-rail" aria-label="Sensory categories">
      <p>Explore by feeling</p>
      <nav id="category-navigation" aria-label="Choose a category"></nav>
    </aside>
    <label class="mobile-category" for="category-select">
      <span>Explore by feeling</span>
      <select id="category-select">
        <option value="desert">Desert &amp; Silence</option>
        <option value="waters">Roaring Waters</option>
        <option value="history">Echoes of History</option>
        <option value="food">Local Flavors</option>
        <option value="nature">Green Landscapes</option>
        <option value="local">Local Life</option>
      </select>
    </label>

    <section class="explore-hero" aria-labelledby="explore-title">
      <p class="eyebrow"><span></span><span id="category-kicker">Water &amp; Wonder</span></p>
      <h1 id="explore-title">Roaring<br><em>Waters</em></h1>
      <p id="explore-description">Dive into Jordan's hidden waters,<br>where nature comes alive.</p>
      <div class="explore-actions">
        <button class="explore-cta" id="explore-cta" type="button">
          <span>See Wadi Mujib</span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
        </button>
        <button class="explore-360" type="button" data-experience="virtual" aria-label="Open immersive 360 degree experience">
          <b>360°</b><span>Look around</span>
        </button>
      </div>
    </section>

    <section class="destination-strip" id="destination-strip" aria-labelledby="destination-heading">
      <div class="strip-heading">
        <div>
          <p>Curated for this feeling</p>
          <h2 id="destination-heading">Places to experience</h2>
        </div>
      </div>
      <div class="destination-list" id="destination-list"></div>
    </section>

    <div class="explore-index" aria-hidden="true"><span id="category-number">03</span><i></i><span>07</span></div>
    <p class="sr-only" id="explore-status" aria-live="polite"></p>
  </main>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/navigation.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/explore.js"></script>
</body>
</html>
