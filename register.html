<!doctype html>
<html lang="en">
<head>
  <script src="js/language-init.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Create your Hawa Jordan travel account.">
  <meta name="theme-color" content="#071629">
  <title>Create Account — Hawa Jordan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body class="auth-page auth-page--register" data-page="register">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="auth-scene" aria-hidden="true"></div>

  <header class="auth-header">
    <a class="auth-home-brand" href="/" aria-label="Hawa Jordan home"><img src="assets/logo/hawa-jordan-logo.png" alt="Hawa Jordan"></a>
    <button class="auth-language" type="button" data-language-toggle data-i18n-ignore>
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 4.4 6.2 4.4 9S15 17.8 12 21c-3-3.2-4.4-6.2-4.4-9S9 6.2 12 3Z"/></svg><span data-language-code>AR</span><span data-language-label>العربية</span>
    </button>
  </header>

  <main id="main-content" class="auth-layout">
    <section class="auth-card" aria-labelledby="register-title">
      <img class="auth-card-logo" src="assets/logo/hawa-jordan-logo.png" alt="Hawa Jordan">
      <h1 id="register-title">Create Your Account</h1>
      <p class="auth-subtitle">Join Hawa Jordan and start your journey</p>

      <div class="auth-mode-note" id="firebase-note" hidden><strong>Preview mode</strong><span>Account creation is not connected yet. Continue as a guest—your trip and passport will still be saved on this device.</span><button id="continue-guest" type="button">Continue as guest →</button></div>

      <div class="form-alert" id="form-alert" role="alert" hidden></div>

      <div class="social-stack">
        <button class="social-auth social-auth--google" id="google-signin" type="button"><span class="google-g" aria-hidden="true">G</span><span>Sign up with Google</span></button>
        <button class="social-auth social-auth--apple" id="apple-signin" type="button"><span class="apple-mark" aria-hidden="true">●</span><span>Sign up with Apple</span></button>
      </div>

      <div class="auth-divider"><span>OR</span></div>

      <form id="register-form" class="auth-form" novalidate>
        <div class="field">
          <label for="full-name">Full Name</label>
          <div class="input-wrap"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input id="full-name" name="fullName" type="text" autocomplete="name" placeholder="Enter your full name" minlength="2" required></div>
          <span class="field-error" data-error-for="fullName"></span>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><input id="email" name="email" type="email" autocomplete="email" placeholder="example@email.com" required></div>
          <span class="field-error" data-error-for="email"></span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a strong password" minlength="6" required><button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
          <span class="field-error" data-error-for="password"></span>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm Password</label>
          <div class="input-wrap"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirm your password" minlength="6" required><button class="password-toggle" type="button" data-toggle-password="confirm-password" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div>
          <span class="field-error" data-error-for="confirmPassword"></span>
        </div>
        <label class="check-row check-row--terms"><input id="terms" name="terms" type="checkbox" checked required><span class="custom-check" aria-hidden="true"></span><span>I agree to the <a href="#terms" data-legal="terms">Terms of Service</a> and <a href="#privacy" data-legal="privacy">Privacy Policy</a></span></label>
        <span class="field-error" data-error-for="terms"></span>
        <button class="button button--gold button--wide auth-submit" type="submit" data-submit><span>Create Account</span><span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login">Sign In</a></p>
    </section>
  </main>

  <dialog class="legal-dialog" id="legal-dialog"><button type="button" id="close-legal" aria-label="Close">×</button><p id="legal-kicker"></p><h2 id="legal-title"></h2><div id="legal-copy"></div></dialog>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
